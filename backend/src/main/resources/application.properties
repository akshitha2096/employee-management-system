# ---------- Server ----------
server.port=${PORT:8080}

# ---------- MySQL (override with environment variables when deployed) ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ems_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# ---------- JPA ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- Admin login ----------
admin.username=${ADMIN_USERNAME:akshitha}
admin.password=${ADMIN_PASSWORD:123456789}

# ---------- CORS (comma separated list of frontend URLs, or * for all) ----------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
